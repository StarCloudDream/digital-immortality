# 思念配置文件 —— 复制为 ~/.sinian/config.yaml 后按需修改

llm:
  # provider: ollama（本地，隐私最好）或 openai_compatible（云端）
  provider: ollama
  model: qwen2.5:7b
  base_url: http://127.0.0.1:11434
  # 云端时填 API key；本地 Ollama 留空
  api_key: ""
  timeout: 120

profile:
  # 前后文窗口大小：每条本人发言前后各抓多少条
  window: 10
  # LLM 侧写最多喂多少段窗口（超出则按时间轴均匀采样）
  max_llm_windows: 40
