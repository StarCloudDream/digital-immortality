[project]
name = "sinian"
version = "0.1.0"
description = "思念（SiNian）—— 数字永生框架：把一个人从聊天记录里读出来，让 TA 以自己的声音继续存在"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["httpx>=0.27"]       # 调用本地/云端 LLM
dev = ["pytest>=8.0"]

[project.scripts]
sinian = "sinian.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
